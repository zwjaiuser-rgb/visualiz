<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>全球幸福感：时空差异</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: #45352e; background: #fff8ef; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    main { max-width: 1280px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 18px; }
    h1 { margin: 0 0 7px; font-size: 28px; font-weight: 650; color: #49352d; }
    p { margin: 0; color: #806b5c; }
    .controls { display: flex; align-items: center; gap: 12px; }
    select, button { font: inherit; color: #493a32; background: #fffdfa; border: 1px solid #e5d6c5; border-radius: 5px; padding: 8px 12px; }
    select:focus, button:focus-visible { outline: 2px solid #e69b62; outline-offset: 2px; }
    button { cursor: pointer; }
    button:hover { background: #fff0df; border-color: #e69b62; }
    .surface { background: #fffdfa; border: 1px solid #eee1d2; border-radius: 6px; padding: 12px; box-shadow: 0 8px 26px rgba(100, 61, 36, 0.055); }
    #chart { width: 100%; height: min(68vh, 680px); min-height: 430px; }
    .foot { display: flex; justify-content: space-between; gap: 16px; padding: 12px 4px 2px; color: #806b5c; font-size: 13px; }
    #status { margin-top: 10px; font-size: 13px; color: #806b5c; }
    @media (max-width: 700px) { body { padding: 14px; } header { align-items: start; flex-direction: column; } h1 { font-size: 22px; } #chart { height: 480px; min-height: 400px; } .foot { flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>全球幸福感的时空差异</h1>
        <p>国家幸福感均值 · World Happiness data · 2011–2025</p>
      </div>
      <div class="controls">
        <label for="year">年份</label>
        <select id="year" aria-label="选择年份"></select>
        <button id="play" type="button">▶ 播放</button>
      </div>
    </header>
    <section class="surface">
      <div id="chart" role="img" aria-label="按年份查看各国幸福感均值的交互世界地图"></div>
      <div class="foot"><span id="count"></span><span>分数越高表示该国幸福感均值越高；灰色表示该年无数据。</span></div>
    </section>
    <div id="status">正在读取数据和世界地图…</div>
  </main>
  <script>
    const chart = echarts.init(document.getElementById('chart'));
    const yearSelect = document.getElementById('year');
    const statusEl = document.getElementById('status');
    let rows = [];
    let timer = null;

    function renderYear(year) {
      const selected = rows.filter(row => String(row.Year) === String(year));
      chart.setOption({
        tooltip: { trigger: 'item', backgroundColor: '#fffdfa', borderColor: '#ead9c5', borderWidth: 1,
          padding: [10, 12], textStyle: { color: '#493a32', fontSize: 13 }, extraCssText: 'box-shadow: 0 6px 20px rgba(100,61,36,.14); border-radius: 5px;', formatter: params => {
          const row = selected.find(item => item.ISO3 === params.name);
          return row ? `${row.Country}<br>幸福感：${Number(row.Happiness).toFixed(2)}<br>地区：${row.Region}` : `${params.name}<br>该年无数据`;
        } },
        visualMap: { min: 2.5, max: 8, left: 24, bottom: 28, itemWidth: 14, itemHeight: 130,
          text: ['更幸福', '较低'], calculable: true, textGap: 8,
          inRange: { color: ['#FFF4DD', '#FFD58E', '#F5A765', '#DF704F', '#B9473F'] },
          textStyle: { color: '#765b49', fontSize: 12 } },
        series: [{ type: 'map', map: 'world', nameProperty: 'name', roam: true, data: selected.map(row => ({ name: row.ISO3, value: Number(row.Happiness) })),
          itemStyle: { areaColor: '#F0E9DF', borderColor: '#FFFDFA', borderWidth: 0.8 },
          emphasis: { label: { show: false }, itemStyle: { areaColor: '#E66E55', borderColor: '#78443A', borderWidth: 1.2 } } }]
      }, true);
      document.getElementById('count').textContent = `${year} 年有数据国家：${selected.length}`;
    }

    async function init() {
      try {
        const [dataResponse, mapResponse] = await Promise.all([
          fetch('./rq1_happiness.json'),
          fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
        ]);
        if (!dataResponse.ok || !mapResponse.ok) throw new Error('数据或地图文件加载失败，请确认服务已启动且网络可用。');
        rows = await dataResponse.json();
        const geo = await mapResponse.json();
        geo.features.forEach(feature => {
          const p = feature.properties;
          p.name = p['ISO3166-1-Alpha-3'] || p.ISO_A3 || p.ADM0_A3;
        });
        echarts.registerMap('world', geo);
        const years = [...new Set(rows.map(row => row.Year))].sort((a, b) => a - b);
        years.forEach(year => yearSelect.add(new Option(String(year), String(year))));
        yearSelect.addEventListener('change', () => renderYear(yearSelect.value));
        document.getElementById('play').addEventListener('click', event => {
          if (timer) { clearInterval(timer); timer = null; event.currentTarget.textContent = '▶ 播放'; return; }
          event.currentTarget.textContent = 'Ⅱ 暂停';
          timer = setInterval(() => {
            const index = years.indexOf(Number(yearSelect.value));
            yearSelect.value = String(years[(index + 1) % years.length]);
            renderYear(yearSelect.value);
          }, 1100);
        });
        yearSelect.value = String(years[0]);
        renderYear(yearSelect.value);
        statusEl.textContent = `已载入 ${rows.length.toLocaleString()} 条国家-年份记录。数据缺少 2013 年，因此年份列表仅展示实际存在的年份。`;
        window.addEventListener('resize', () => chart.resize());
      } catch (error) {
        statusEl.textContent = `${error.message} 请用本目录启动本地 HTTP 服务后访问页面。`;
      }
    }
    init();
  </script>
</body>
</html>
